<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline | Bright Roots</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fffdf8;
        color: #2e342f;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }
      h1 {
        font-size: 28px;
        margin: 20px 0 8px;
      }
      p {
        color: #6e5a46;
        max-width: 320px;
        margin: 0 auto 24px;
        line-height: 1.5;
      }
      button {
        background: #3f5d46;
        color: white;
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Bright Roots needs an internet connection. Check your Wi-Fi or data, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
