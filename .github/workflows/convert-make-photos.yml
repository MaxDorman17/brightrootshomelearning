name: Convert make photos

# When pictures are pushed into frontend/public/make-photos (activities) or
# frontend/public/lessons/new (lessons), turn them into the JPGs the site uses and commit them back.
on:
  push:
    branches: [main]
    paths:
      - "frontend/public/make-photos/*.png"
      - "frontend/public/make-photos/*.PNG"
      - "frontend/public/make-photos/*.jpeg"
      - "frontend/public/make-photos/*.webp"
      - "frontend/public/lessons/new/*"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/convert_make_photos.py
      - name: Commit the JPGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A frontend/public/make-photos frontend/public/lessons
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Convert new pictures to JPGs"
            git push
          fi
